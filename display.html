<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FastTurno — Pantalla Turnos</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
<div class="display-page">

  <!-- HEADER -->
  <header class="display-header">
    <div class="display-brand">🍔 <span>FastTurno</span></div>
    <div style="color:rgba(255,255,255,.5);font-size:.85rem">Pantalla de Turnos</div>
    <div class="display-clock" id="reloj">00:00:00</div>
  </header>

  <!-- BODY -->
  <div class="display-body">

    <!-- COLUMNA IZQUIERDA — Turno actual -->
    <div class="display-col display-col-left">
      <div class="display-col-title">🔊 Turno en curso</div>
      <div class="turno-activo" id="turno-activo">
        <div class="turno-activo-idle">Esperando turnos...</div>
      </div>
    </div>

    <!-- COLUMNA DERECHA — Cola -->
    <div class="display-col">
      <div class="display-col-title">📋 Cola de pedidos</div>
      <div class="cola-display" id="cola-display">
        <p class="display-empty">Sin pedidos en cola</p>
      </div>
    </div>

  </div>
</div>

<script src="js/store.js"></script>
<script src="js/channel.js"></script>
<script>
// ── RELOJ ─────────────────────────────────────────────
function actualizarReloj() {
  const ahora = new Date();
  document.getElementById('reloj').textContent =
    ahora.toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
}
actualizarReloj();
setInterval(actualizarReloj, 1000);

// ── AUDIO (sin archivos externos) ────────────────────
function reproducirSonido() {
  try {
    const ctx  = new (window.AudioContext || window.webkitAudioContext)();
    const notas = [523.25, 659.25, 783.99]; // Do, Mi, Sol
    notas.forEach((freq, i) => {
      const osc  = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.frequency.value = freq;
      osc.type = 'sine';
      gain.gain.setValueAtTime(.35, ctx.currentTime + i * 0.18);
      gain.gain.exponentialRampToValueAtTime(.001, ctx.currentTime + i * 0.18 + 0.4);
      osc.start(ctx.currentTime + i * 0.18);
      osc.stop(ctx.currentTime  + i * 0.18 + 0.4);
    });
  } catch(e) {}
}

// ── RENDER TURNO ACTIVO ───────────────────────────────
function mostrarTurnoLlamado(turno) {
  const el = document.getElementById('turno-activo');
  el.innerHTML = `
    <div class="turno-activo-icono">🔊</div>
    <div class="turno-activo-num flash" id="num-display">${turno}</div>
    <div class="turno-activo-msg">Pase a retirar por caja</div>`;
  reproducirSonido();
  setTimeout(() => {
    const nd = document.getElementById('num-display');
    if (nd) nd.classList.remove('flash');
  }, 2000);
}

function limpiarTurnoActivo() {
  document.getElementById('turno-activo').innerHTML =
    '<div class="turno-activo-idle">Esperando turnos...</div>';
}

// ── RENDER COLA ───────────────────────────────────────
function renderCola() {
  const pedidos = Store.getPedidos().filter(p =>
    ['pendiente', 'en_preparacion', 'llamado'].includes(p.estado)
  );
  const cola = document.getElementById('cola-display');

  if (pedidos.length === 0) {
    cola.innerHTML = '<p class="display-empty">Sin pedidos en cola 🎉</p>';
    return;
  }

  cola.innerHTML = pedidos.map(p => {
    const esLlamado = p.estado === 'llamado';
    const esPrep    = p.estado === 'en_preparacion';
    const claseCard = esLlamado ? '' : esPrep ? 'en-prep' : '';
    const badgeText = esLlamado ? 'LLAMADO' : esPrep ? 'En prep.' : 'Esperando';
    const badgeCls  = esLlamado ? 'ready' : 'prep';

    return `
    <div class="cola-item ${claseCard}">
      <span class="cola-num">${p.turno}</span>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px">
        <span class="cola-badge ${badgeCls}">${badgeText}</span>
        <span style="font-size:.75rem;color:rgba(255,255,255,.4)">⏱️ ~${p.tiempoEstimado} min</span>
      </div>
    </div>`;
  }).join('');
}

// ── BROADCAST CHANNEL LISTENERS ───────────────────────
Canal.escuchar(EVENTOS.NUEVO_PEDIDO, pedido => {
  renderCola();
});

Canal.escuchar(EVENTOS.PEDIDO_EN_PREP, () => {
  renderCola();
});

Canal.escuchar(EVENTOS.TURNO_LLAMADO, ({ turno }) => {
  mostrarTurnoLlamado(turno);
  renderCola();
});

Canal.escuchar(EVENTOS.TURNO_COMPLETADO, () => {
  limpiarTurnoActivo();
  renderCola();
});

Canal.escuchar(EVENTOS.TURNO_CANCELADO, ({ turno }) => {
  const num = document.getElementById('num-display');
  if (num && num.textContent === turno) limpiarTurnoActivo();
  renderCola();
});

// ── INICIALIZAR ───────────────────────────────────────
// Cargar estado actual desde localStorage (para cuando se abre la pantalla)
renderCola();

// Mostrar el último turno llamado si existe
const ultimoLlamado = Store.getPedidos().find(p => p.estado === 'llamado');
if (ultimoLlamado) mostrarTurnoLlamado(ultimoLlamado.turno);
</script>
</body>
</html>
