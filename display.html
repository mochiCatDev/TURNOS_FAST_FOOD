<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pantalla de Turnos — FastTurno</title>
  <link rel="icon" type="image/png" href="assets/img/icon.png" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    /* Adaptaciones para pantalla TV siempre visible */
    html, body { height: 100%; overflow: hidden; }
    body { background: var(--charcoal); }

    .display-page {
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Animación de entrada del número */
    @keyframes num-pop {
      0%   { transform: scale(.85); opacity: 0; }
      60%  { transform: scale(1.04); }
      100% { transform: scale(1);   opacity: 1; }
    }
    .number-animate {
      animation: num-pop .35s cubic-bezier(.34,1.56,.64,1) both;
    }

    /* Columna de cola: scroll automático */
    .display-queue-list {
      overflow-y: auto;
      scrollbar-width: none;
    }
    .display-queue-list::-webkit-scrollbar { display: none; }

    /* Texto grande en la marca */
    .display-header .brand { font-size: 1.3rem; }

    @media (max-width: 700px) {
      .display-main { grid-template-columns: 1fr; }
      .display-queue { display: none; }
      .display-now .number-big { font-size: 6rem; }
    }
  </style>
</head>
<body>

<div class="display-page">

  <!-- HEADER -->
  <div class="display-header">
    <div class="brand">
      <i class="fa-solid fa-burger"></i>
      <span>FastTurno</span>
    </div>
    <div style="display:flex; align-items:center; gap:1.25rem;">
      <div class="connected-badge">
        <span class="dot"></span>
        <span id="connStatus">Conectado</span>
      </div>
      <div class="clock" id="reloj">--:--:--</div>
    </div>
  </div>

  <!-- MAIN -->
  <div class="display-main" style="flex:1; overflow:hidden;">

    <!-- Turno llamado -->
    <div class="display-now">
      <div class="label-calling">
        <i class="fa-solid fa-volume-high fa-sm"></i>
        Turno en ventanilla
      </div>
      <div class="number-big" id="numBig">---</div>
      <div class="status-text" id="statusText">
        <i class="fa-regular fa-clock fa-sm"></i>
        Esperando pedidos...
      </div>
    </div>

    <!-- Cola de turnos -->
    <div class="display-queue">
      <div class="display-queue-header">
        <i class="fa-solid fa-list-ol fa-sm"></i>
        Cola de turnos
      </div>
      <div class="display-queue-list" id="queueList">
        <!-- Generado por JS -->
        <div style="padding:1.5rem; text-align:center; color:var(--charcoal-3); font-size:.9rem;">
          Sin turnos en espera
        </div>
      </div>
    </div>

  </div><!-- /display-main -->

  <!-- FOOTER -->
  <div class="display-footer">
    <i class="fa-solid fa-circle-info fa-sm"></i>
    <span>Cuando tu número aparezca en pantalla, acércate a la ventanilla a retirar tu pedido.</span>
    <span style="margin-left:auto; font-size:.75rem; opacity:.6;" id="footerDate"></span>
  </div>

</div>

<!-- ===================== SCRIPTS ===================== -->
<script src="js/store.js"></script>
<script src="js/channel.js"></script>
<script>
/* ============================================================
   Estado de la pantalla
   ============================================================ */
const DISPLAY = {
  broadcast: null,
  turnoActual: null,
  cola: [],
};

/* ============================================================
   INICIALIZACIÓN
   ============================================================ */
document.addEventListener('DOMContentLoaded', () => {
  DISPLAY.broadcast = Channel.getInstance();
  DISPLAY.broadcast.addEventListener('message', onMessage);

  // Cargar estado inicial desde localStorage
  cargarEstadoInicial();

  // Reloj
  actualizarReloj();
  setInterval(actualizarReloj, 1000);

  // Fecha footer
  const hoy = new Date().toLocaleDateString('es-AR', {
    weekday: 'long', day: 'numeric', month: 'long',
  });
  document.getElementById('footerDate').textContent = capitalizar(hoy);
});

function cargarEstadoInicial() {
  const pedidos = Store.getPedidos ? Store.getPedidos() : [];
  // Excluir solo cancelados; los entregados sí se muestran (al final de la cola)
  DISPLAY.cola = pedidos
    .filter(p => p.estado !== 'cancelado')
    .slice(-20);

  // Buscar el turno llamado más reciente
  const llamado = [...pedidos].reverse().find(p => p.estado === 'listo' || p.estado === 'llamado');
  if (llamado) {
    mostrarTurno(llamado.turno, 'Pase a retirar su pedido.');
  }

  renderCola();
}

/* ============================================================
   BROADCAST CHANNEL
   ============================================================ */
function onMessage(e) {
  const { evento, datos } = e.data || {};
  switch (evento) {
    case EVENTOS.TURNO_LLAMADO:
      mostrarTurno(datos?.numero ?? datos?.turno, 'Pase a retirar su pedido.');
      actualizarCola(datos);
      break;
    case EVENTOS.TURNO_COMPLETADO:
      actualizarCola(datos);
      break;
    case EVENTOS.TURNO_CANCELADO:
      actualizarCola(datos);
      break;
    case EVENTOS.NUEVO_PEDIDO:
      // Agregar a la cola
      if (datos?.turno) {
        DISPLAY.cola.push({
          turno: datos.turno,
          estado: 'pendiente',
          items: datos.items || [],
        });
        renderCola();
      }
      break;
    case EVENTOS.PEDIDO_EN_PREP:
      // Actualizar estado en cola
      actualizarCola(datos);
      break;
    case EVENTOS.MENU_ACTUALIZADO:
    case EVENTOS.STOCK_ACTUALIZADO:
      // Solo interesa para sincronizar, no afecta la display
      break;
  }
}

function actualizarCola(datos) {
  const pedidos = Store.getPedidos ? Store.getPedidos() : [];
  // Excluir solo cancelados; los entregados sí se muestran (al final de la cola)
  DISPLAY.cola = pedidos
    .filter(p => p.estado !== 'cancelado')
    .slice(-20);
  renderCola();
}

/* ============================================================
   AUDIO — beep al llamar turno
   ============================================================ */
function beep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [523.25, 659.25, 783.99].forEach((freq, i) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.frequency.value = freq; o.type = 'sine';
      const t = ctx.currentTime + i * .18;
      g.gain.setValueAtTime(.32, t);
      g.gain.exponentialRampToValueAtTime(.001, t + .38);
      o.start(t); o.stop(t + .38);
    });
  } catch (e) { /* silencioso si no hay AudioContext */ }
}

/* ============================================================
   RENDERIZAR TURNO LLAMADO
   ============================================================ */
function mostrarTurno(numero, texto) {
  DISPLAY.turnoActual = numero;

  beep();
  const el = document.getElementById('numBig');
  el.textContent = numero;
  el.classList.remove('number-animate');
  // forzar reflow para reiniciar animación
  void el.offsetWidth;
  el.classList.add('number-animate');

  const st = document.getElementById('statusText');
  st.innerHTML = `<i class="fa-solid fa-check-circle fa-sm" style="color:#4ade80;"></i> ${texto}`;
}

/* ============================================================
   RENDERIZAR COLA
   ============================================================ */
function renderCola() {
  const el = document.getElementById('queueList');
  if (!el) return;

  const items = DISPLAY.cola;
  if (!items.length) {
    el.innerHTML = `<div style="padding:1.5rem; text-align:center; color:var(--charcoal-3); font-size:.9rem;">
      <i class="fa-solid fa-hourglass"></i><br>Sin turnos en espera
    </div>`;
    return;
  }

  // Ordenar: activos primero (pendiente / en prep / listo / llamado), entregados al final
  const ordenEstado = { pendiente: 0, 'en prep': 1, listo: 2, llamado: 3, entregado: 4 };
  const itemsOrdenados = items.slice().sort((a, b) => {
    const oa = ordenEstado[a.estado] ?? 0;
    const ob = ordenEstado[b.estado] ?? 0;
    if (oa !== ob) return ob - oa; // dentro del mismo grupo, más recientes primero
    return b.turno - a.turno;
  });

  el.innerHTML = '';
  itemsOrdenados.forEach(p => {
    const esCurrent    = p.turno == DISPLAY.turnoActual;
    const esPrep       = p.estado === 'en prep';
    const esEntregado  = p.estado === 'entregado';
    const div = document.createElement('div');
    div.className = 'display-queue-item' +
      (esCurrent || p.estado === 'listo' || p.estado === 'llamado' ? ' dq-active' : '') +
      (esEntregado ? ' dq-done' : '');

    let etiqueta;
    if (esEntregado)        etiqueta = 'Entregado';
    else if (esPrep)        etiqueta = 'En preparación';
    else if (p.estado === 'listo')   etiqueta = 'Listo';
    else if (p.estado === 'llamado') etiqueta = 'Llamado';
    else                    etiqueta = 'Esperando';

    div.innerHTML = `
      <span class="dq-num">#${p.turno}</span>
      <span class="dq-desc">
        ${(p.items || []).length} prod. — ${etiqueta}
      </span>
      ${esEntregado
        ? '<i class="fa-solid fa-check" style="color:#4ade80; font-size:.85rem;"></i>'
        : esCurrent
          ? '<i class="fa-solid fa-volume-high" style="color:var(--amber-light); font-size:.85rem;"></i>'
          : ''}
    `;
    el.appendChild(div);
  });
}

/* ============================================================
   RELOJ
   ============================================================ */
function actualizarReloj() {
  const ahora = new Date();
  const h = String(ahora.getHours()).padStart(2,'0');
  const m = String(ahora.getMinutes()).padStart(2,'0');
  const s = String(ahora.getSeconds()).padStart(2,'0');
  const el = document.getElementById('reloj');
  if (el) el.textContent = `${h}:${m}:${s}`;
}

/* ============================================================
   UTILIDADES
   ============================================================ */
function capitalizar(s) {
  if (!s) return '';
  return s.charAt(0).toUpperCase() + s.slice(1);
}
</script>
</body>
</html>
