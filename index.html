<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FastTurno — Iniciar Sesión</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <div class="login-logo">
        <div class="logo-icon">🍔</div>
        <h1>FastTurno</h1>
        <p>Sistema de Gestión de Turnos</p>
      </div>

      <form id="form-login">
        <div class="form-group">
          <label for="usuario">Usuario</label>
          <input type="text" id="usuario" class="form-control" placeholder="Ingresa tu usuario" autocomplete="off" required />
        </div>
        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" class="form-control" placeholder="Ingresa tu contraseña" required />
        </div>
        <button type="submit" class="btn btn-primary btn-block btn-lg">Ingresar</button>
        <p class="login-error" id="error-msg"></p>
      </form>

      <div class="login-hint">
        <strong>Credenciales de prueba:</strong><br/>
        Admin: <code>admin</code> / <code>admin123</code><br/>
        Kiosco: <code>kiosco</code> / <code>kiosco123</code>
      </div>
    </div>
  </div>

  <!-- Toast container -->
  <div id="toast-container"></div>

  <script src="js/store.js"></script>
  <script src="js/channel.js"></script>
  <script src="js/auth.js"></script>
  <script>
    // Inicializar datos de prueba
    Store.seedInicial();

    // Si ya hay sesión activa, redirigir
    const sesion = Auth.getSesion();
    if (sesion) {
      window.location.href = sesion.rol === 'admin' ? 'admin.html' : 'kiosco.html';
    }

    document.getElementById('form-login').addEventListener('submit', e => {
      e.preventDefault();
      const usuario  = document.getElementById('usuario').value.trim();
      const password = document.getElementById('password').value.trim();
      const errorEl  = document.getElementById('error-msg');

      const user = Auth.login(usuario, password);
      if (!user) {
        errorEl.textContent = '⚠️ Usuario o contraseña incorrectos.';
        return;
      }
      errorEl.textContent = '';
      window.location.href = user.rol === 'admin' ? 'admin.html' : 'kiosco.html';
    });
  </script>
</body>
</html>
